name: Hangtime
options:
  bundleIdPrefix: app.headroom
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8XX544GLPH
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Hangtime:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Widgets/UsageWidgets.swift
      - path: Widgets/WidgetIntents.swift
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.headroom.mac
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Hangtime.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: HangtimeWidgets
        embed: true
  HangtimeWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.headroom.mac.widgets
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
