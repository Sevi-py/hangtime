name: Release

# A release ships when MARKETING_VERSION in project.yml on main is bumped to a version that has no tag yet
# (scripts/release.sh <version> does that bump). Every other push to main is CI only, so users' apps don't
# auto-update and restart for each commit.
on:
  push:
    branches: [main]
    paths: [project.yml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(sed -nE 's/^ *MARKETING_VERSION: "([^"]+)".*/\1/p' project.yml | head -1)
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$LATEST" && "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
            echo "::error::project.yml version $VERSION is lower than the latest release $LATEST."
            exit 1
          else
            echo "Releasing $VERSION (previous: ${LATEST:-none})."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, notarize and publish ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [[ -n "${!s}" ]] || { echo "::error::Missing repository secret $s"; exit 1; }
          done
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          [[ -n "$DEVELOPER_ID_P12" ]] || { echo "::error::Missing repository secret DEVELOPER_ID_P12"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS=$(uuidgen)
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASS" "$KEYCHAIN" >/dev/null
          EXISTING=()
          while IFS= read -r k; do EXISTING+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          rm -f "$RUNNER_TEMP/devid.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Set up
        id: setup
        uses: ./.github/actions/setup

      - name: Build, sign and notarize (universal)
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DERIVED_DATA: build/ci
          BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}
        run: scripts/build-release.sh "$VERSION"

      - name: Publish GitHub release and update cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/publish-release.sh "$VERSION"

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hangtime-${{ env.VERSION }}
          path: dist/${{ env.VERSION }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Save compilation cache
        if: always() && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/ci/CompilationCache.noindex
            build/ci/SDKExplicitPrecompiledModules
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
