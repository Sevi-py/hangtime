name: Set up Xcode build
description: Selects the newest stable Xcode, installs a cached XcodeGen, generates the project and restores the compilation cache.

inputs:
  xcodegen-version:
    description: XcodeGen release to use
    default: "2.46.0"

outputs:
  cache-key:
    description: Exact key for saving the compilation cache after the build
    value: ${{ steps.keys.outputs.exact }}
  cache-hit:
    description: Whether the exact compilation cache key was restored
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Select Xcode
      id: xcode
      shell: bash
      run: |
        XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
        sudo xcode-select -s "$XCODE"
        VERSION=$(xcodebuild -version | awk 'NR==1{print $2} NR==2{print $3}' | paste -sd- -)
        echo "Using $XCODE ($VERSION)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache XcodeGen
      id: xcodegen-cache
      uses: actions/cache@v4
      with:
        path: ~/.xcodegen
        key: xcodegen-${{ inputs.xcodegen-version }}-${{ runner.os }}

    - name: Install XcodeGen
      if: steps.xcodegen-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
          "https://github.com/yonaskolb/XcodeGen/releases/download/${{ inputs.xcodegen-version }}/xcodegen.zip"
        unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
        mkdir -p ~/.xcodegen
        cp -R "$RUNNER_TEMP"/xcodegen/xcodegen/* ~/.xcodegen/

    - name: Generate project
      shell: bash
      run: |
        echo "$HOME/.xcodegen/bin" >> "$GITHUB_PATH"
        ~/.xcodegen/bin/xcodegen generate

    # Xcode's compilation cache is content-addressed, so it still hits after actions/checkout resets every
    # file's modification time (which defeats a plain DerivedData cache). Cold build ~40 s, warm ~8 s.
    - name: Compute cache key
      id: keys
      shell: bash
      run: |
        PREFIX="xcode-cc-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-"
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        echo "exact=$PREFIX${{ hashFiles('App/**', 'Shared/**', 'Widgets/**', 'Resources/**', 'Config/**', 'project.yml') }}" >> "$GITHUB_OUTPUT"

    - name: Restore compilation cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          build/ci/CompilationCache.noindex
          build/ci/SDKExplicitPrecompiledModules
        key: ${{ steps.keys.outputs.exact }}
        restore-keys: ${{ steps.keys.outputs.prefix }}
